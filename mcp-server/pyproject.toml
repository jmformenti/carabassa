[project]
name = "carabassa-mcp"
version = "0.1.0"
description = "MCP server for the Carabassa media management REST API"
readme = "README.md"
license = "MIT"
authors = [{ name = "jmformenti" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.1",
]

[project.scripts]
carabassa-mcp = "carabassa_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
]
