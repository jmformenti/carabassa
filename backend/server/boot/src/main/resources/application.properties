carabassa.version=@project.version@
carabassa.repodir=${CARABASSA_REPO_DIR}
carabassa.tempdir=${carabassa.repodir}/tmp
carabassa.default-tz=Europe/Andorra

# Auth JWT (enabled for tests)
carabassa.auth.enabled=true
carabassa.auth.admin.username=admin
carabassa.auth.admin.password=changeme
carabassa.auth.jwt.secret=${CARABASSA_JWT_SECRET:aVeryLongSecretKeyThatNeedsToBeAtLeast256BitsLongForHMACSHA256Signature12345}
carabassa.auth.jwt.expiration=86400

# Natural language search (LLM). Feature is enabled when both url and model are set.
carabassa.llm.url=${CARABASSA_LLM_URL:}
carabassa.llm.model=${CARABASSA_LLM_MODEL:}
carabassa.llm.api-key=${CARABASSA_LLM_API_KEY:}
carabassa.llm.max-iterations=5
# Optional path to a system-prompt template. When set, the file is read on each
# request so edits take effect without restarting. Use {{tags}} as the
# placeholder for the auto-generated tag list.
carabassa.llm.prompt-file=${CARABASSA_LLM_PROMPT_FILE:}
# Spring AI OpenAI auto-config: map our carabassa.llm.* to the standard properties.
# Chat is always enabled at the auto-config level so the ChatClient bean exists;
# AskController gates real invocation behind LlmProperties.isEnabled() so when
# CARABASSA_LLM_URL/MODEL are unset the dummy bean is created but never called.
# All other Spring AI model types (audio/embedding/image/moderation) stay off
# to avoid auto-creating unrelated beans that fail without credentials.
spring.ai.model.chat=openai
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.openai.base-url=${CARABASSA_LLM_URL:http://localhost}
spring.ai.openai.api-key=${CARABASSA_LLM_API_KEY:dummy}
spring.ai.openai.chat.options.model=${CARABASSA_LLM_MODEL:dummy-model}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
spring.servlet.multipart.location=${carabassa.tempdir}
logging.level.org.springframework.boot.web.embedded=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.org.apache.catalina.core=WARN
logging.level.com.zaxxer.hikari=WARN
# H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=${CARABASSA_H2_CONSOLE:false}
spring.h2.console.path=/h2
spring.h2.console.settings.webAllowOthers=${CARABASSA_H2_WEB_ALLOW_OTHERS:false}
spring.datasource.url=jdbc:h2:${carabassa.repodir}/carabassa.db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=100
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.hibernate.ddl-auto=update
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.use-code-as-default-message=true
